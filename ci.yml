name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Financial schema guardrails
        run: |
          grep -q "numeric(20,2)" supabase/migrations/*_foundation.sql
          ! grep -Eiq "amount[[:space:]]+(real|double precision|float)" supabase/migrations/*_foundation.sql
          grep -q "idempotency_key" supabase/migrations/*_foundation.sql
          grep -q "enable row level security" supabase/migrations/*_foundation.sql
      - run: npm run build
